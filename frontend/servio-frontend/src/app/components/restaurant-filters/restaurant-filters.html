<div class="filters">

  <label class="filter-item">
    <!-- ngModel: connects input to a variable -->
    <input
      type="checkbox"
      [(ngModel)]="filters.freeDelivery"
      (change)="onFiltersChange()"
    />
    Free delivery
  </label>

  <label class="filter-item">
    Max delivery time (min)
    <input
      type="number"
      min="1"
      [(ngModel)]="filters.maxDeliveryTime"
      (input)="onFiltersChange()"
      placeholder="e.g. 30"
    />
  </label>

  <label class="filter-item">
    Min rating
    <input
      type="number"
      min="1"
      max="5"
      step="0.1"
      [(ngModel)]="filters.minRating"
      (input)="onFiltersChange()"
      placeholder="e.g. 4"
    />
  </label>

  <label class="filter-item">
    Max min. order (€)
    <input
      type="number"
      min="0"
      [(ngModel)]="filters.maxMinOrder"
      (input)="onFiltersChange()"
      placeholder="e.g. 15"
    />
  </label>

</div>
